services:
  - type: web
    name: kvm-retail-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
